<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true; cardboardModeEnabled: true">
      <a-sky color="#ECECEC"></a-sky>
      <a-plane rotation="-90 0 0" width="50" height="50" color="#7BC8A4"></a-plane>

      <a-assets>
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
      </a-assets>

      <a-entity
        gltf-model="#modeloIndustrial"
        position="0 0 -10"
        rotation="0 0 0"
        scale="0.01 0.01 0.01"
      ></a-entity>

    </a-scene>
  </body>
</html>
